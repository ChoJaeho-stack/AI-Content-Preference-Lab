spring.application.name=contentlab

server.port=8080

contentlab.auth.cookie-secure=${CONTENTLAB_AUTH_COOKIE_SECURE:false}

spring.data.redis.connect-timeout=300ms
spring.data.redis.timeout=300ms

spring.datasource.url=jdbc:mysql://localhost:3306/ai_content_lab
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
